# HTTPS 版 nginx 配置模板
# 使用方式：
#   1. 复制为 nginx-ssl.conf.local（避免 git pull 覆盖你的修改）
#   2. 替换 server_name 与证书路径
#   3. 在 docker-compose.yml 的 web 服务中挂载证书目录与本文件
#
# 注意：本文件为模板，其中的域名和证书路径需要替换为实际值。

# ---- HTTP：全部跳转 HTTPS（certbot 的验证路径除外）----
server {
    listen 80;
    server_name your.domain.com www.your.domain.com;

    # Let's Encrypt standalone 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主服务 ----
server {
    listen 443 ssl;
    http2 on;
    server_name your.domain.com www.your.domain.com;

    # 证书（二选一）
    # 阿里云免费证书：
    ssl_certificate     /etc/nginx/ssl/your.domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your.domain.com.key;
    # Let's Encrypt：
    # ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 确认站点稳定后再启用 HSTS（启用后浏览器会强制 HTTPS，难以回退）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    # API 反向代理到 NestJS 后端（保留 /api 前缀）
    # X-Forwarded-Proto 保证后端能识别真实协议，避免重定向循环
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 音频静态资源长缓存
    location /audio/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
